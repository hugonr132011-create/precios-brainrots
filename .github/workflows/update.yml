name: Actualizar precios

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch: {}       # boton "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Descargar precios
        run: python update_prices.py
      - name: Guardar en el repo
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "Precios $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi
